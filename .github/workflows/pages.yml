name: Pages

# Publishes site/ to https://marlogg74mp.github.io/zipmount/. The page finds
# the latest installer through the GitHub API when it loads, so a new release
# needs no redeploy; only changes to the site itself do.

on:
  push:
    branches: [master]
    paths:
      - "site/**"
      - "docs/hero.jpg"
      - "docs/icon-256.png"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write      # deploy
  id-token: write   # prove the deployment comes from this workflow

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      # The images live in docs/ for the README; copy them rather than keep
      # a second copy in the repository.
      - name: Assemble the site
        run: |
          mkdir _site
          cp site/* _site/
          cp docs/hero.jpg docs/icon-256.png _site/

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5

name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            features: ""
          # Never distributed, but it has to keep compiling and passing: people
          # build it for their own use.
          - name: Windows, with rar
            os: windows-latest
            features: --features zipmount/rar
          # Mounting through FUSE, which neither the build nor the tests need.
          - name: Linux
            os: ubuntu-latest
            features: ""
          # No mounting yet, but every archive command and the translations.
          - name: macOS
            os: macos-latest
            features: ""
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - uses: ./.github/actions/winfsp
        if: runner.os == 'Windows'

      - name: Formatting
        if: matrix.name == 'Windows'
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets ${{ matrix.features }} -- -D warnings

      # Among the tests: every translation must carry exactly the English set
      # of messages, and every id the code asks for must exist.
      - name: Tests
        run: cargo test --workspace ${{ matrix.features }}

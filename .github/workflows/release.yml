name: Release

# Pushing a tag vX.Y.Z builds ZipMount from that commit for Windows (the
# installers), Linux (x86_64 and ARM64, static) and macOS (Apple Silicon),
# and puts it all into one draft release, with SHA256SUMS.txt and a build
# provenance attestation. Publishing the draft stays a manual click.
#
# Started by hand (Actions → Release → Run workflow) it builds and packs
# everything and stops short of attesting and releasing: a rehearsal before
# the tag. The packages are left as the run's artifacts.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - id: version
        name: The version, checked against the tag
        run: |
          version=$(sed -n '/^\[workspace\.package\]/,/^\[/s/^version *= *"\([0-9.]*\)".*/\1/p' Cargo.toml)
          [ -n "$version" ] || { echo "no version in [workspace.package] in Cargo.toml"; exit 1; }
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml, which says v$version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The installer version's fourth field is the commit count, and a
          # shallow clone would make it 1.
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: ./.github/actions/winfsp

      - name: Tests
        run: cargo test --workspace

      # The version matters: without one the current branch is fetched, which
      # WiX 4 cannot load. Extensions go to .wix in the repository root, where
      # the build script expects them.
      - name: Install WiX
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 4.0.5
          $wix = Join-Path $env:USERPROFILE '.dotnet\tools\wix.exe'
          & $wix extension add WixToolset.Bal.wixext/4.0.5
          & $wix extension add WixToolset.Util.wixext/4.0.5

      # The context menu package is signed with a self-signed certificate made
      # on this runner; its private key disappears with the runner, so no key
      # outlives the release it signed.
      - name: Build the installers
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools\build-installer.ps1

      # Checks that the MSI was built as the version in Cargo.toml and names
      # the files as they are published.
      - name: Stage
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools\publish-release.ps1 -StageOnly

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: target/release-${{ needs.version.outputs.version }}/*
          if-no-files-found: error

  unix:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          # musl: one static binary runs on every distribution, however old
          # or new its C library.
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - name: linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: musl C compiler
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -yq musl-tools

      - name: Tests
        run: cargo test --workspace

      - name: Build
        run: cargo build --release --locked -p zipmount --target ${{ matrix.target }}

      - name: Pack
        run: |
          dir=zipmount-${{ needs.version.outputs.version }}-${{ matrix.name }}
          mkdir "$dir"
          cp target/${{ matrix.target }}/release/zipmount README.md LICENSE THIRD-PARTY-NOTICES.md "$dir/"
          "$dir/zipmount" --version
          tar -czf "$dir.tar.gz" "$dir"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: zipmount-*.tar.gz
          if-no-files-found: error

  release:
    needs: [version, windows, unix]
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the draft release
      id-token: write      # sign the attestation
      attestations: write  # store it
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: |
          sha256sum -- * > ../SHA256SUMS.txt
          mv ../SHA256SUMS.txt .
          cat SHA256SUMS.txt

      # Attests exactly the files listed in SHA256SUMS.txt.
      - uses: actions/attest-build-provenance@v4
        if: github.ref_type == 'tag'
        with:
          subject-checksums: dist/SHA256SUMS.txt

      - name: Draft the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          sh tools/release-notes.sh "$VERSION" dist > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "ZipMount $VERSION" \
            --notes-file notes.md \
            --draft

      - name: The notes it would publish
        if: github.ref_type != 'tag'
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: sh tools/release-notes.sh "$VERSION" dist

[package]
name = "zipmount"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "zipmount"
path = "src/main.rs"

[dependencies]
zipfs-core.workspace = true
anyhow.workspace = true
clap.workspace = true
zipmount-i18n.workspace = true
ctrlc.workspace = true
rpassword.workspace = true

[target.'cfg(windows)'.dependencies]
zipfs-mount.workspace = true
zipmount-shell.workspace = true
windows-sys.workspace = true
windows.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true
# SIGTERM and SIGHUP too, not just Ctrl+C: `kill` or a closed terminal
# should unmount as cleanly as Ctrl+C does.
ctrlc = { workspace = true, features = ["termination"] }

[target.'cfg(target_os = "linux")'.dependencies]
zipfs-fuse.workspace = true

[features]
rar = ["zipfs-core/rar"]

[target.'cfg(windows)'.build-dependencies]
winfsp.workspace = true

[package]
name = "zipfs-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
zipmount-i18n.workspace = true
anyhow.workspace = true
memmap2.workspace = true
libdeflater.workspace = true
flate2.workspace = true
encoding_rs.workspace = true
rayon.workspace = true
rustc-hash.workspace = true
sevenz-rust2.workspace = true
aes.workspace = true
ctr.workspace = true
hmac.workspace = true
sha1.workspace = true
pbkdf2.workspace = true
zeroize.workspace = true
grep-searcher.workspace = true
grep-regex.workspace = true
libz-rs-sys.workspace = true
unrar = { workspace = true, optional = true }
grep-matcher.workspace = true
regex.workspace = true

[features]
# Off by default: the UnRAR license forbids building an archiver on that code,
# and the restriction is compatible neither with GPLv3 nor with WinFsp's FLOSS
# exception. A rar build for your own use is fine; distributing one is not.
rar = ["dep:unrar"]
